{% extends 'base.html' %}

{% block title %}Recipe Search{% endblock %}

{% block content %}
<h1>Search Recipes</h1>

<!-- Search form using Django GET method -->
<form id="search-form" method="GET" action="{% url 'search_recipes' %}">
    <input type="text" name="ingredient" placeholder="Search by ingredient..." autocomplete="off"
        value="{{ request.GET.ingredient }}">
    <button type="submit">Search</button>
</form>

{% endblock %}
