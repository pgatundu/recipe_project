{% extends 'base.html' %}

{% block title %}Confirm Delete Profile{% endblock %}

{% block content %}
<h1>Confirm Delete Profile</h1>
<p>Are you sure you want to delete your profile? This action cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete my profile</button>
    <a href="{% url 'profile' %}">Cancel</a>
</form>
{% endblock %}
