{% extends 'base.html' %}

{% block content %}
<h2>Register</h2>
<div class="register-form">
    <form id="register-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <label for="email">Email (optional):</label>
        <input type="email" name="email" id="email">
        <button id="register-button" type="submit">Register</button>
    </form>
</div>
{% endblock %}
