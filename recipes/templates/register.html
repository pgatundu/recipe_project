{% extends 'base.html' %}

{% block content %}
<h2>Register</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <label for="email">Email (optional):</label>
    <input type="email" name="email" id="email">

    <label for="photo">Profile Photo:</label>
    <input type="file" name="photo" id="photo" accept="image/*">

    <button type="submit">Register</button>
</form>

<h3>Or register with:</h3>
<button onclick="window.location.href='YOUR_GMAIL_LOGIN_URL'">Gmail</button>
<button onclick="window.location.href='YOUR_FACEBOOK_LOGIN_URL'">Facebook</button>
<button onclick="window.location.href='YOUR_X_LOGIN_URL'">X</button>
<button onclick="window.location.href='YOUR_INSTAGRAM_LOGIN_URL'">Instagram</button>

{% endblock %}
